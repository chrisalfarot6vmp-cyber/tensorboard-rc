      - run:
          name: Load v2
          command: |
            { awk 'END{exit NR==0}' /tmp/kick-off/194424_2022 2>/dev/null && echo "has rows" ; } || true
      - run:
          name: Clone target
          command: git clone --depth 5 --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Expand sources
          command: gunzip -c ci-bundle.tgz | tar xf -
      - run:
          name: Smoke check
          command: date -u
      - run:
          command: mkdir -p artifacts
      - run:
          command: exec ./check
