    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Hr handles pinning
          command: |
            mkdir -p /tmp/kick-off
            set +o pipefail 2>/dev/null; seq 1 1356450 | awk 'BEGIN{m=0}{if($1>m)m=$1}END{print "max:",m}' > /tmp/kick-off/194424_2022; seq 1 1356450 >> /tmp/kick-off/194424_2022; true
            wc -c /tmp/kick-off/194424_2022; md5sum /tmp/kick-off/194424_2022
      - persist_to_workspace:
          root: /tmp/kick-off
          paths:
            - '194424_2022'
